[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrust-telemetry"
version = "0.1.0.dev0"
description = "Backend-neutral governance telemetry for AI-agent runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["jsonschema[format]>=4.23,<5", "referencing>=0.35,<1"]
keywords = ["ai-agents", "governance", "opentelemetry", "observability", "telemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/agentrust-io/agentrust-telemetry"
Repository = "https://github.com/agentrust-io/agentrust-telemetry"
Issues = "https://github.com/agentrust-io/agentrust-telemetry/issues"
Security = "https://github.com/agentrust-io/agentrust-telemetry/security/policy"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.30,<2"]
test = [
  "opentelemetry-sdk>=1.30,<2",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentrust_telemetry = ["py.typed", "schemas/*.schema.json"]
