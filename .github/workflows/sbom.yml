name: SBOM

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cyclonedx-bom -e ".[test]"
      - run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentrust-telemetry-sbom
          path: sbom.cdx.json
          retention-days: 90
