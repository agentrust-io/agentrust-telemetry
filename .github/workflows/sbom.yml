name: SBOM

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/sbom.txt
      - run: python -m pip install --require-hashes -r requirements/test.txt
      - run: python -m pip install --no-deps -e .
      - run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentrust-telemetry-sbom
          path: sbom.cdx.json
          retention-days: 90
