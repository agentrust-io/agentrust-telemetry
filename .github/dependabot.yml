version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
